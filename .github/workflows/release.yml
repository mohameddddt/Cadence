name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MUSICPLAYER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "MUSICPLAYER_KEYSTORE_B64 secret is missing - refusing to publish a debug-signed release"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MUSICPLAYER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build split-ABI release APKs
        env:
          MUSICPLAYER_KEYSTORE_PASSWORD: ${{ secrets.MUSICPLAYER_KEYSTORE_PASSWORD }}
          MUSICPLAYER_KEY_ALIAS: ${{ secrets.MUSICPLAYER_KEY_ALIAS }}
          MUSICPLAYER_KEY_PASSWORD: ${{ secrets.MUSICPLAYER_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Changelog for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: build/app/outputs/flutter-apk/*-release.apk
