name: musicplayer
description: "Cadence - your music, in rhythm. A personal music player and library manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.2
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  image: ^4.10.1
  intl: ^0.20.2
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  url_launcher: ^6.3.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  http_mock_adapter: ^0.6.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
